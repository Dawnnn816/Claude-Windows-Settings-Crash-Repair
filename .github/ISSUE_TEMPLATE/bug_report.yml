name: 问题报告
description: 报告 Windows 设置闪退、扫描误判或修复异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请只提交程序导出的脱敏报告和脱敏日志。不要上传完整注册表、完整事件日志、用户名、SID 或用户目录文件。
  - type: input
    id: tool-version
    attributes:
      label: 工具版本
      placeholder: 例如 1.3.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows 版本与 OS Build
      placeholder: 例如 25H2 / 26200.xxxx
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Desktop 版本
      placeholder: 不确定时填写“不确定”
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序描述点击了什么、何时卡死或退出。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 扫描与修复结果
      description: 粘贴脱敏后的关键结果，或拖入程序导出的脱敏文件。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不含用户名、SID、计算机名、完整用户目录路径或原始注册表导出。
          required: true
